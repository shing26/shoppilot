name: ci-subset

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-subset-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: Build and JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify build and JVM tests
        run: bash ./mvnw -B -ntp verify

      # 票 34（ADR 0033 前置闸门）：这几步都是 0 token、纯 stdlib——judge 自检 40 项断言，
      # 离线 rescore 按当前判据重算 2026-09-10 六份入库明细并钉住期望差异集合（对偶矛盾四条），
      # round17 再加新增套件判分器的 24 条夹具。
      # judge()、gold 或套件判据的任何静默漂移都会让这几步变红，这是票 36-39 扩判据前的比对背书。
      - name: Eval judge selfcheck (0-token)
        run: python3 scripts/verify_eval_judge.py

      - name: Offline rescore gate (0-token)
        run: >
          python3 scripts/run_tool_eval.py --rescore
          eval/results/tool-eval-20260910-080638-dev-budgetfix.csv
          eval/results/tool-eval-20260910-080732-dev-budgetfix.csv
          eval/results/tool-eval-20260910-080830-dev-budgetfix.csv
          eval/results/tool-eval-20260910-080926-dev-budgetfix.csv
          eval/results/tool-eval-20260910-080942-dev-budgetfix.csv
          eval/results/tool-eval-20260910-075747-dev.csv
          --rescore-expected-diff ACT-ORD-09,ACT-ORD-11,ACT-ORD-16,ACT-ORD-17

      # round17：part4-7 套件的判分器（scripts/eval_suites.py）自带 24 条夹具，同样是 0 token、
      # 纯 stdlib。套件本体要活体网关进不了 CI，夹具是它能进 CI 的那一半——没有这一步，
      # 新判据的漂移只能靠人记得手动跑。它不并进 verify_eval_judge.py：收口审计 B7 有意把那份
      # 跑器（判据的断言载体）留在内容级禁面，本轮不改它。
      - name: Suite scorer selfcheck (0-token)
        run: python3 scripts/eval_suites.py

      # round18 票 44 / ADR 0041：覆盖率棘轮。产物由上面那一步 verify 的 jacoco:report 产出，
      # 这一步只读产物按模块分别比门槛（LINE 设闸 / BRANCH 只报），同样是 0 token、纯 stdlib。
      # 它落在 CI 里是**范围边界的更正而不是判据改动**：round15 spec 把「覆盖率」列进 Out of Scope
      # 的原始理由是子集门禁不依赖外部服务，而 JaCoCo 在进程内跑，那条理由对覆盖率本来就不成立。
      - name: Coverage ratchet (0-token)
        run: python3 scripts/check_coverage.py

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7
