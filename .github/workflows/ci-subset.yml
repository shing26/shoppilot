name: ci-subset

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-subset-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: Build and JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify build and JVM tests
        run: bash ./mvnw -B -ntp verify

      # 票 34（ADR 0033 前置闸门）：这几步都是 0 token、纯 stdlib——judge 自检 40 项断言，
      # 离线 rescore 按当前判据重算 2026-09-10 六份入库明细并钉住期望差异集合（对偶矛盾四条），
      # round17 再加新增套件判分器的 24 条夹具。
      # judge()、gold 或套件判据的任何静默漂移都会让这几步变红，这是票 36-39 扩判据前的比对背书。
      - name: Eval judge selfcheck (0-token)
        run: python3 scripts/verify_eval_judge.py

      - name: Offline rescore gate (0-token)
        run: >
          python3 scripts/run_tool_eval.py --rescore
          eval/results/tool-eval-20260910-080638-dev-budgetfix.csv
          eval/results/tool-eval-20260910-080732-dev-budgetfix.csv
          eval/results/tool-eval-20260910-080830-dev-budgetfix.csv
          eval/results/tool-eval-20260910-080926-dev-budgetfix.csv
          eval/results/tool-eval-20260910-080942-dev-budgetfix.csv
          eval/results/tool-eval-20260910-075747-dev.csv
          --rescore-expected-diff ACT-ORD-09,ACT-ORD-11,ACT-ORD-16,ACT-ORD-17

      # round17：part4-7 套件的判分器（scripts/eval_suites.py）自带 24 条夹具，同样是 0 token、
      # 纯 stdlib。套件本体要活体网关进不了 CI，夹具是它能进 CI 的那一半——没有这一步，
      # 新判据的漂移只能靠人记得手动跑。它不并进 verify_eval_judge.py：收口审计 B7 有意把那份
      # 跑器（判据的断言载体）留在内容级禁面，本轮不改它。
      - name: Suite scorer selfcheck (0-token)
        run: python3 scripts/eval_suites.py

      # round22 票 65 / ADR 0050：task 级判据（「这件事最终办成了吗」）的夹具自检 + 用例结构校验。
      # 判据面只读 plan[]/context.ruleIds/fallbackReason 三个既有字段，单独成列、不给总分、
      # 不并入四列；与套件夹具同属 0 token、无网关的步骤。活体跑批入口是 run_tool_eval.py --task。
      - name: Task-level scorer selfcheck (0-token)
        run: python3 scripts/eval_task.py

      # round22 票 64 / ADR 0049：检索融合录放门的**只校验那一层**（0 token、无网关）。
      # 重算在 JVM（RetrievalFusionReplayTest，随上面那步 verify 一起跑）：它由夹具的两路序重算融合、
      # 比对 top-K 前缀，并核「四个常数来自生产 application.yml」「语料 sha 现算相等」。
      # 这一步只做 Python 独有的四件事：夹具 schema、fused ⊆ dense ∪ lexical、语料 sha、
      # 常数与 yml 一致 —— **刻意不在 Python 里复算 RRF**（两份实现就是第二份判据）。
      # 哈希钉防的是"夹具被悄悄换掉"：重录夹具必须同步改这个 env（与 check_coverage.py 同模式）。
      - name: Retrieval fusion gate (0-token)
        env:
          RETRIEVAL_FIXTURE_SHA256: 8f3ee90a1c0b3e865539fcc25a894d6befb3953e881fb5de8bdb65e516cac7fe
        run: python3 scripts/retrieval_gate.py

      # round18 票 44 / ADR 0041：覆盖率棘轮。产物由上面那一步 verify 的 jacoco:report 产出，
      # 这一步只读产物按模块分别比门槛（LINE 设闸 / BRANCH 只报），同样是 0 token、纯 stdlib。
      # 它落在 CI 里是**范围边界的更正而不是判据改动**：round15 spec 把「覆盖率」列进 Out of Scope
      # 的原始理由是子集门禁不依赖外部服务，而 JaCoCo 在进程内跑，那条理由对覆盖率本来就不成立。
      - name: Coverage ratchet (0-token)
        run: python3 scripts/check_coverage.py

      # round22 票 67 / ADR 0051：告警规则的离线单元测试。ADR 0024 当年把「最小告警集」列为非目标，
      # 理由是「本机无实例，写了只能证语法、证不了该响时会不会响」；`promtool test rules` 喂合成序列、
      # 断言该响时响与不该响时不响，证的正是那一句，且满足那份 ADR 的总筛子（0 token、不依赖活体读数）。
      # 因此 ADR 0030 第 5 条的触发线真正达成 —— 这一步是「触发已到」，不是政策越过。
      #
      # 代价照 ADR 0051 写实：这是本仓 CI 子集里**唯一**一个需要下载外部二进制的步骤，所以它排在
      # 最后（失败时不该拖住前面那些 0 依赖步骤），版本 pin 死，并按发布方公布的 sha256sums.txt
      # 校验下载物。**它证明的是规则在该响的合成序列上确实响，不证明生产会响。**
      - name: Alert rules unit test (promtool, 0-token)
        run: |
          set -euo pipefail
          VERSION=2.53.2
          BASE="https://github.com/prometheus/prometheus/releases/download/v${VERSION}"
          TARBALL="prometheus-${VERSION}.linux-amd64.tar.gz"
          curl -fsSL -o "/tmp/${TARBALL}" "${BASE}/${TARBALL}"
          curl -fsSL -o /tmp/prom-sha256sums.txt "${BASE}/sha256sums.txt"
          (cd /tmp && grep " ${TARBALL}\$" prom-sha256sums.txt | sha256sum -c -)
          tar -xzf "/tmp/${TARBALL}" -C /tmp "prometheus-${VERSION}.linux-amd64/promtool"
          PROMTOOL="/tmp/prometheus-${VERSION}.linux-amd64/promtool"
          "$PROMTOOL" check rules ops/alerts/shoppilot.rules.yml
          cd ops/alerts
          "$PROMTOOL" test rules shoppilot.rules.test.yml

      # round23 票 73 / ADR 0057：坐席工作台的前端构建门禁。**产物入库**（所有者裁定 E），
      # 所以这一步不只是「能构建」——它还要证明**构建结果与仓里那份逐字节一致**：
      # 重新构建再 `git diff`，产物漂了就红。
      #
      # 代价照 ADR 0051 那一档写实：这是本仓 CI 子集里**第二个**需要下载外部东西的步骤
      # （第一个是 promtool）。但它与 promtool 不同：node 来自 runner 自带的 setup-node，
      # 依赖由 lockfile 钉死、下载量在几十 MB 量级，且**失败时不影响前面那些步骤的结论**——
      # 排在 promtool 之后就是这个理由。
      - name: Set up Node for the workspace build
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend-workspace/.nvmrc
          cache: npm
          cache-dependency-path: frontend-workspace/package-lock.json

      - name: Workspace build (frontend, 0-token)
        run: |
          set -euo pipefail
          cd frontend-workspace
          npm ci --no-fund --no-audit
          npm run typecheck
          npm run build
          cd ..
          # 产物入库，所以「构建成功」不够：它必须和仓里那份一样。
          git diff --exit-code -- shoppilot-gateway/src/main/resources/static/workspace \
            || (echo '::error::工作台构建产物与仓内不一致——改了源码请重新构建并提交产物' && exit 1)

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7
