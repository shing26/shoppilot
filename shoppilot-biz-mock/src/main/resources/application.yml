server:
  port: 8091
  # 只监听本机：浏览器不得直连本服务（ticket 15），网关是唯一调用方
  address: 127.0.0.1

spring:
  application:
    name: shoppilot-biz-mock
  datasource:
    url: jdbc:h2:mem:shoppilot;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      # 压测要能不改码调池：ticket 18 的 HikariCP 饱和点对比实验用 SHOPPILOT_BIZMOCK_POOL_SIZE 切换
      maximum-pool-size: ${SHOPPILOT_BIZMOCK_POOL_SIZE:30}
      minimum-idle: 5
  jpa:
    hibernate:
      # round18 票 42 / ADR 0041：模式的唯一产生源是 db/migration（Flyway V1 基线）。
      # validate 让实体与 DDL 的漂移在起栈期即失败——3 条 @SpringBootTest 继承本文件，
      # 所以这条守卫同时覆盖测试路径。回滚口径见 db/rollback/U1__baseline_down.sql。
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 200
        order_inserts: true
        # ADR 0005 防线二：@TenantId + 该 resolver 让所有查询自动拼接归属条件
        tenant_identifier_resolver: com.shoppilot.bizmock.tenant.HibernateTenantResolver
  flyway:
    enabled: true
    locations: classpath:db/migration
    # clean-disabled 保持默认 true。回滚走「整库重放」路径时临时打开，
    # 两条回滚路径的口径写在 db/rollback/U1__baseline_down.sql 的文件头。

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      # Boot 只在 K8s 环境下自动注册 livenessState/readinessState 这两个指示器，本机必须显式打开，
      # 否则下面的 group 会因为成员不存在而直接启动失败（实测报 NoSuchHealthContributorException）。
      probes:
        enabled: true
      group:
        # Readiness gate: /actuator/health flips to UP as soon as the web server binds,
        # but SeedRunner (an ApplicationRunner) is still inserting 50k orders at that point.
        # Callers must wait on /actuator/health/readiness instead -- Spring Boot only
        # publishes ACCEPTING_TRAFFIC after all ApplicationRunners return.
        readiness:
          include: readinessState
        liveness:
          include: livenessState

shoppilot:
  bizmock:
    # ADR 0002：故障注入，用于现场演示降级
    default-delay-ms: 0
    default-fail-rate: 0.0
    internal-token: ${SHOPPILOT_INTERNAL_TOKEN:dev-internal-token-change-me}
    seed:
      enabled: true
      tenants: 3
      customers: 200
      orders: 50000
