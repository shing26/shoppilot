# ShopPilot 的中间件 + **可选**容器档（round23 票 76 / ADR 0053）
#
# ============================================================================
# 两种用法，边界在 profile 上
# ============================================================================
#   docker compose up -d                # 只有中间件（**默认，行为与本票之前逐字一致**）
#   docker compose --profile full up -d --build    # 中间件 + 四个域服务（干净克隆一条命令）
#
# 日常开发仍然用 scripts/up.ps1（本机 JVM，改代码即重启）。容器档是并行的一条路，
# 用途是「别人 clone 下来能起」以及本机内存紧张时**让 OOM 杀掉容器**而不是杀掉
# 你另外三个项目的容器或桌面应用。
#
# 服务与中间件必须在**同一个 compose 网络**里按服务名互访（`biz-mock:8091` 而非
# `127.0.0.1:8091`）。这正是最初把它拆成第二个文件时失败的地方：跨文件要声明
# external network，而 external 网络在中间件还没起时不存在，`config` 直接报错。
#
# 缺一不可的三件事，缺了收益会悄悄丢掉：
#   1. 每个服务都有 `mem_limit` + `restart`：没有内存上限，OOM 时死的是别人的进程；
#   2. compose 网络内用**容器内端口**（redis:6379 / qdrant:6333 / es:9200），
#      不是宿主映射的 16379/16333/19200 —— 用错端口会连上一个根本没起的东西；
#   3. **不进 CI**：round15 起 CI 八步就不依赖外部服务，runner 上跑不起来那条纪律不因本档放宽。

x-service-env: &service-env
  # 内部服务凭证与本机档同源。
  #
  # **故意不给仓库默认值**：ADR 0029 的守卫要求「非回环绑定时三处凭证都被环境变量覆盖」，
  # 这里兜底成 `dev-internal-token-change-me` 就等于「没覆盖」，守卫会在启动前把服务拒掉——
  # 那是正确的失败，但报错指向 compose 而不是指向「你该导出凭证」。留空让它响亮地拦。
  #
  # 于是容器档的用法是：**先导出凭证，再一条命令**：
  #   $env:SHOPPILOT_INTERNAL_TOKEN / $env:SHOPPILOT_OPS_TOKEN（或 SHOPPILOT_OPS_ENABLED=false）
  SHOPPILOT_INTERNAL_TOKEN: ${SHOPPILOT_INTERNAL_TOKEN:-}
  SHOPPILOT_JWT_SECRET: ${SHOPPILOT_JWT_SECRET:-}
  # 运维面：守卫认这两处之一——给 token，或显式关掉运维端点（故障注入是改状态的动作）
  SHOPPILOT_OPS_TOKEN: ${SHOPPILOT_OPS_TOKEN:-}
  SHOPPILOT_OPS_ENABLED: ${SHOPPILOT_OPS_ENABLED:-true}
  # 中间件：容器内端口
  SHOPPILOT_REDIS_HOST: redis
  SHOPPILOT_REDIS_PORT: "6379"
  SHOPPILOT_QDRANT_URL: http://qdrant:6333
  SHOPPILOT_ES_URL: http://elasticsearch:9200
  # 模型走宿主 Ollama：容器化 Ollama 要处理 Windows + WSL2 + GPU 直通，那是另一个量级的坑，
  # 而模型那 3.1 GB 本来就在宿主上——走这条路并不省这块内存。
  SHOPPILOT_OLLAMA_URL: http://host.docker.internal:11434

services:
  redis:
    image: redis:7-alpine
    # 票 76 补：中间件也必须有 restart。原先只有 full 档的服务有，
    # 结果中间件被宿主内存压杀之后就再没起来，而网关 restart 策略在它上面空转
    # （实测重启 72 次，日志里全是 Unable to connect to Redis）。
    restart: unless-stopped
    container_name: shoppilot-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      # 宿主端口用偏移值：这台机器上 Docker Desktop 的 wslrelay 已占住 6379/6333/9200
      - "127.0.0.1:16379:6379"
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    # 票 76 补：中间件也必须有 restart。原先只有 full 档的服务有，
    # 结果中间件被宿主内存压杀之后就再没起来，而网关 restart 策略在它上面空转
    # （实测重启 72 次，日志里全是 Unable to connect to Redis）。
    restart: unless-stopped
    container_name: shoppilot-qdrant
    ports:
      - "127.0.0.1:16333:6333"
    mem_limit: 512m
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # 这个镜像里没有 wget 也没有 curl（command not found，rc=127），所以原来那条健康检查
      # 从第一天起就没成功过一次：容器永远标 unhealthy，而读写全正常。恒红的健康检查只会教人
      # 忽略红色。镜像里有 bash，就用 bash 的 /dev/tcp 手搓一次 GET /readyz 并断言 200。
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: elasticsearch:7.17.24
    # 票 76 补：中间件也必须有 restart。原先只有 full 档的服务有，
    # 结果中间件被宿主内存压杀之后就再没起来，而网关 restart 策略在它上面空转
    # （实测重启 72 次，日志里全是 Unable to connect to Redis）。
    restart: unless-stopped
    container_name: shoppilot-es
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
      bootstrap.memory_lock: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "127.0.0.1:19200:9200"
    mem_limit: 1024m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ---- 可选容器档：四个域服务（profile full）---------------------------------
  # 一次性作业：政策知识库入库。本机档是 scripts/ingest.ps1 用 maven 起一次网关 jar，
  # 容器档用同一个镜像 + ingest profile，跑完退出（restart: "no"）。
  ingest:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: shoppilot-gateway
    image: shoppilot/gateway:local
    profiles: ["full"]
    restart: "no"
    mem_limit: 640m
    # 不传 --server.port：网关有一条硬校验「port 必须在 1..65535」（本仓配置纪律），
    # 而「用 0 表示随机端口」会被它当场拒绝。本机档的 scripts/ingest.ps1 同样不传端口——
    # 它靠「入库跑在网关起来之前」来避开端口冲突，容器档保持同一套假设。
    command: ["--spring.profiles.active=ingest"]
    environment:
      <<: *service-env
      SHOPPILOT_KNOWLEDGE_DIR: /workspace/knowledge
      LOG_APP: ingest
    volumes:
      # 语料只读挂载：它是这一档唯一需要读宿主磁盘的东西
      - ./knowledge:/workspace/knowledge:ro
    depends_on:
      qdrant: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }

  biz-mock:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: shoppilot-biz-mock
    image: shoppilot/biz-mock:local
    profiles: ["full"]
    restart: unless-stopped
    mem_limit: 512m
    environment:
      <<: *service-env
      # 容器内必须绑 0.0.0.0：Docker 的端口发布是宿主→容器的 NAT，容器只听自己回环就没人能连上。
      # 对外暴露面没变——gateway 的端口仍然只发布到宿主回环（见下方 ports）。
      SHOPPILOT_SERVER_ADDRESS: "0.0.0.0"
    depends_on:
      redis: { condition: service_healthy }

  ticket:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: shoppilot-ticket
    image: shoppilot/ticket:local
    profiles: ["full"]
    restart: unless-stopped
    mem_limit: 512m
    environment:
      <<: *service-env
      SHOPPILOT_SERVER_ADDRESS: "0.0.0.0"
    depends_on:
      redis: { condition: service_healthy }

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: shoppilot-gateway
    image: shoppilot/gateway:local
    profiles: ["full"]
    restart: unless-stopped
    mem_limit: 768m
    ports:
      # 调试台与坐席工作台的唯一入口：浏览器只经网关访问内部服务（票 15 纪律）
      - "127.0.0.1:8082:8082"
    environment:
      <<: *service-env
      SHOPPILOT_SERVER_ADDRESS: "0.0.0.0"
      # 容器冷启动首请求要初始化 DispatcherServlet（实测 >3s），默认 3s 会把首个降级落单打超时。
      # 只在容器档放宽——本机档仍是 3s，口径不动。
      SHOPPILOT_TICKET_READ_TIMEOUT: "15s"
      SHOPPILOT_BIZMOCK_URL: http://biz-mock:8091
      SHOPPILOT_TICKET_URL: http://ticket:8092
      SHOPPILOT_KNOWLEDGE_DIR: /workspace/knowledge
    volumes:
      - ./knowledge:/workspace/knowledge:ro
    depends_on:
      ingest: { condition: service_completed_successfully }
      biz-mock: { condition: service_started }
      ticket: { condition: service_started }

volumes:
  qdrant-data:
  es-data: