services:
  redis:
    image: redis:7-alpine
    container_name: shoppilot-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      # 宿主端口用偏移值：这台机器上 Docker Desktop 的 wslrelay 已占住 6379/6333/9200
      - "127.0.0.1:16379:6379"
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: shoppilot-qdrant
    ports:
      - "127.0.0.1:16333:6333"
    mem_limit: 512m
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # 这个镜像里没有 wget 也没有 curl（command not found，rc=127），所以原来那条健康检查
      # 从第一天起就没成功过一次：容器永远标 unhealthy，而读写全正常。恒红的健康检查只会教人
      # 忽略红色。镜像里有 bash，就用 bash 的 /dev/tcp 手搓一次 GET /readyz 并断言 200。
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: elasticsearch:7.17.24
    container_name: shoppilot-es
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
      bootstrap.memory_lock: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "127.0.0.1:19200:9200"
    mem_limit: 1024m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  qdrant-data:
  es-data:
