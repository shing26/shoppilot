<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopPilot 调试台</title>
<style>
  :root {
    /* --ink-3 从 #8b929d（白底 2.9:1）换到 #6b7280（4.8:1）：走查第 12 项量的就是这一族小字，
       label / .dim / #mode / .empty / .ctl .t 全挂在它上面，改一个令牌比逐处补颜色少一分漏改。 */
    --bg: #f2f3f5; --panel: #fff; --ink: #14161a; --ink-2: #5c636e; --ink-3: #6b7280;
    --line: #dfe2e7; --line-2: #eceef1;
    --teal: #0f766e; --amber: #b45309; --rose: #be123c; --violet: #6d28d9;
    --sky: #0369a1; --green: #15803d;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  /* 竖向改成 flex 分配：原先 main 的高度是 calc(100vh - 49px - 62px)，把页脚按死 62px，
     窄屏一页脚一换行就盖住内容。现在 footer 自然高、main 吃剩余。 */
  body { margin: 0; background: var(--bg); color: var(--ink); height: 100dvh; display: flex; flex-direction: column;
    font: 13px/1.55 system-ui, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: var(--panel); border-bottom: 1px solid var(--line); height: 49px; flex: none;
    position: relative; z-index: 21; }
  header h1 { font-size: 14px; margin: 0 10px 0 0; font-weight: 650; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); display: inline-block; }
  .dot.bad { background: var(--rose); }
  /* 读不到读数时的第三态。灰既不承诺"还能应答"，也不冒充"别再给它流量"：
     原先只有绿红两档，取不到读数时页面只能落在绿上，那盏灯从此不可能说谎，也不可能说真话。 */
  .dot.unknown { background: var(--ink-3); }
  .grow { flex: 1; }
  main { display: grid; grid-template-columns: 250px minmax(0,1fr) 400px;
    flex: 1; min-height: 0; gap: 1px; background: var(--line); }
  section { background: var(--panel); min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  section > h2 { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3);
    margin: 0; padding: 9px 12px 7px; border-bottom: 1px solid var(--line-2); font-weight: 650; }
  .body { padding: 12px; overflow: auto; min-height: 0; }
  label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--ink-3); margin: 12px 0 4px; font-weight: 650; }
  label:first-child { margin-top: 0; }
  input, select, button { font: inherit; color: inherit; }
  input[type=text], select { width: 100%; padding: 5px 7px; border: 1px solid var(--line);
    border-radius: 6px; background: #fff; }
  button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--ink-3); }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  button.sm { padding: 2px 7px; font-size: 11px; border-radius: 5px; }
  .row { display: flex; gap: 6px; align-items: center; }
  .claims { font-family: var(--mono); font-size: 11px; background: var(--line-2); border-radius: 6px;
    padding: 7px 8px; overflow-wrap: anywhere; color: var(--ink-2); }
  #chat { flex: 1; overflow: auto; padding: 12px; min-height: 0; }
  .msg { margin-bottom: 12px; }
  .msg .who { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin-bottom: 3px; }
  .msg .bubble { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap;
    overflow-wrap: anywhere; background: #fff; }
  .msg.user .bubble { background: var(--line-2); border-color: var(--line-2); }
  .msg .cite { margin-top: 5px; font-family: var(--mono); font-size: 10px; color: var(--ink-3); overflow-wrap: anywhere; }
  .msg details.cite { margin-top: 5px; font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
  .msg details.cite > summary { cursor: pointer; list-style: none; color: var(--teal); }
  .msg details.cite > summary::-webkit-details-marker { display: none; }
  .msg details.cite ul { margin: 4px 0 0; padding-left: 16px; overflow-wrap: anywhere; }
  .composer { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--line-2); }
  .composer input { flex: 1; }
  /* 空输入提交不再静默：一句可见的回显，role=status 让它同时进可读区。 */
  .hint { padding: 0 12px 8px; font-size: 12px; color: var(--amber); min-height: 0; }
  .hint:empty { display: none; }
  /* 首字延迟期间的进行态：走查第 2 项量到 11.6 s 里界面是空的，那段时间必须有个「正在」。 */
  .typing { color: var(--ink-3); }
  .typing::after { content: '…'; }
  #timeline { flex: 1; overflow: auto; min-height: 0; }
  .ev { display: grid; grid-template-columns: 78px minmax(0,1fr); gap: 8px; padding: 5px 10px;
    border-bottom: 1px solid var(--line-2); font-size: 12px; }
  .ev .k { font-family: var(--mono); font-size: 10px; font-weight: 700; padding-top: 2px; }
  .ev .v { min-width: 0; overflow-wrap: anywhere; }
  .dim { color: var(--ink-3); }
  .ev.status .k { color: var(--ink-3); }
  .ev.meta .k { color: var(--sky); }
  .ev.tool_executing .k, .ev.tool_result .k { color: var(--violet); }
  .ev.slot_ask .k { color: var(--amber); }
  .ev.fallback .k, .ev.rate_limited .k, .ev.duplicate_submit .k { color: var(--rose); }
  .ev.done .k { color: var(--green); }
  .ev.token .k { color: var(--teal); }
  .ev.ops .k { color: var(--ink-2); }
  .ev.ops.ok .v { color: var(--green); }
  .ev.ops.bad .v { color: var(--rose); }
  .chips { display: flex; flex-wrap: wrap; gap: 2px; }
  .chip { font-family: var(--mono); font-size: 11px; background: #ecfdf8; border: 1px solid #a7f3d0;
    border-radius: 4px; padding: 0 3px; }
  footer { background: var(--panel); border-top: 1px solid var(--line); display: flex; align-items: center;
    flex-wrap: wrap; gap: 9px 13px; padding: 9px 12px; min-height: 62px; }
  .ctl { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .ctl .t { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 650; }
  input[type=range] { width: 104px; accent-color: var(--teal); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 4px 9px; font-size: 11px; background: #fff; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed=true] { background: var(--ink); color: #fff; }
  .val { font-family: var(--mono); font-size: 11px; min-width: 44px; color: var(--ink-2); }
  /* 抽屉从 header 下沿开始（49px 与上面 header 的声明高度同源）：压在 header 之上时，
     「工单队列」那颗按钮会被抽屉自己盖住，点开之后就再也关不掉了（走查第 11 项）。 */
  aside.drawer { position: fixed; inset: 49px 0 0 auto; width: min(520px,92vw); background: var(--panel);
    border-left: 1px solid var(--line); box-shadow: -12px 0 28px rgba(20,22,26,.10);
    transform: translateX(100%); transition: transform .18s ease; display: flex; flex-direction: column; z-index: 20; }
  aside.drawer.open { transform: none; }
  #tickets { flex: 1; overflow: auto; }
  .tk { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; padding: 9px 12px;
    border-bottom: 1px solid var(--line-2); align-items: start; }
  .tk .id { font-family: var(--mono); font-size: 11px; color: var(--ink-2); overflow-wrap: anywhere; }
  .tk .q { overflow-wrap: anywhere; }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
  .badge.OPEN { color: var(--amber); border-color: #fcd34d; background: #fffbeb; }
  .badge.ASSIGNED { color: var(--sky); border-color: #7dd3fc; background: #f0f9ff; }
  .badge.RESOLVED { color: var(--green); border-color: #86efac; background: #f0fdf4; }
  .empty { color: var(--ink-3); padding: 14px; }
  /* 运维回执与问答事件流分家（走查第 10 项）：ops 的行落在 #opslog 里，
     它不再是每轮 clearTimeline() 的清场对象，也不再混进 .ev 的序列。 */
  .opslog { border-top: 1px solid var(--line); background: var(--line-2); max-height: 34%; overflow: auto; }
  .opslog > .cap { font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--ink-2);
    padding: 7px 10px 1px; letter-spacing: .04em; }
  .ops { display: grid; grid-template-columns: 78px minmax(0,1fr); gap: 8px; padding: 4px 10px; font-size: 12px; }
  .ops .k { font-family: var(--mono); font-size: 10px; font-weight: 700; padding-top: 2px; color: var(--ink-2); }
  .ops .v { min-width: 0; overflow-wrap: anywhere; }
  .ops.ok .v { color: var(--green); }
  .ops.bad .v { color: var(--rose); }
  /* 这一格坐在 line-2 的浅灰底上：同一支 --ink-3 在白底是 4.83:1，落在这里只有 4.16:1，
     走查第 12 项量的正是「同一族小字」，不是只量白底那几处。深一档到 --ink-2 即 5.5:1 起。 */
  .opslog .empty { padding: 6px 10px; color: var(--ink-2); }
  /* 遮罩压在抽屉下面、内容上面；抽屉从 header 下沿开始，不再盖住那颗「工单队列」按钮。 */
  .scrim { position: fixed; inset: 49px 0 0 0; background: rgba(20,22,26,.28); z-index: 19; }
  .scrim[hidden] { display: none; }
  /* 窄屏不再整块藏时间线（走查第 7 项）：换成横跨两列的一条，位置看得见、内容还在。 */
  @media (max-width: 1100px) {
    main { grid-template-columns: 200px minmax(0,1fr); grid-template-rows: minmax(0,1fr) minmax(140px,34%); }
    #pane-events { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<header>
  <span class="dot" id="health"></span>
  <h1>ShopPilot 调试台</h1>
  <span class="dim" id="mode">mode -</span>
  <span class="grow"></span>
  <div class="ctl"><span class="t">ops</span><input type="text" id="opsToken" size="14" placeholder="运维令牌"></div>
  <button id="btnTickets">工单队列</button>
</header>
<main>
  <section id="pane-id">
    <h2>身份</h2>
    <div class="body">
      <label>店铺 tenant</label><select id="tenant"></select>
      <label>买家 customer</label>
      <!-- 买家 id 要有个上限（走查那轮的次一级项）：一千多字符的 id 会把 claims 那格撑爆，
           而它本来就不是合法 id。32 与演示/验收在用的 id 形状相符，超出的字符根本进不来。 -->
      <input type="text" id="customer" value="C001" maxlength="32" autocomplete="off">
      <div class="row" style="margin-top:10px">
        <button class="primary sm" id="btnLogin">换身份</button>
        <button class="sm" id="btnNewConv">新会话</button>
      </div>
      <label>当前 claims</label><div class="claims" id="claims">未签发</div>
      <label>会话 id</label><div class="claims" id="conv"></div>
    </div>
  </section>
  <section id="pane-chat">
    <h2>对话</h2>
    <div id="chat"></div>
    <div class="composer">
      <input type="text" id="q" value="生鲜坏了怎么赔" placeholder="向客服提问">
      <button class="primary" id="btnSend">发送</button>
    </div>
    <div class="hint" id="hint" role="status" aria-live="polite"></div>
  </section>
  <section id="pane-events">
    <h2>事件时间线</h2>
    <div id="timeline"><div class="empty">尚无事件</div></div>
    <div class="opslog" id="opslog">
      <div class="cap">运维回执</div>
      <div class="empty" id="opslogEmpty">尚无运维动作</div>
    </div>
  </section>
</main>
<footer>
  <div class="ctl"><span class="t">biz delay</span><input type="range" id="delay" min="0" max="4000" step="100" value="0"><span class="val" id="delayV">0 ms</span></div>
  <div class="ctl"><span class="t">fail rate</span><input type="range" id="failRate" min="0" max="1" step="0.05" value="0"><span class="val" id="failRateV">0.00</span></div>
  <div class="ctl"><span class="t">llm</span><div class="seg" id="llmSeg">
    <button data-mode="none" aria-pressed="true">none</button><button data-mode="timeout">timeout</button><button data-mode="unavailable">unavailable</button><button data-mode="budget">budget</button>
  </div></div>
  <div class="ctl"><button class="sm" id="btnApply">注入</button><button class="sm" id="btnClear">清除</button>
    <button class="sm" id="btnFlush">清缓存</button><button class="sm" id="btnDemo">复位演示单</button></div>
  <div class="ctl"><span class="t">circuit</span><span class="val" id="circuit">-</span><span class="t">refunds</span><span class="val" id="refunds">-</span></div>
</footer>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer">
  <h2 style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:0;padding:13px 12px;border-bottom:1px solid var(--line-2);font-weight:650" class="row">
    <span class="grow">工单队列</span><button class="sm" id="btnCloseTickets">关闭</button></h2>
  <div id="tickets"><div class="empty">尚未拉取</div></div>
</aside>
<script>
const $ = (id) => document.getElementById(id);
const state = { token: '', tenant: 'T001', customer: 'C001', conv: crypto.randomUUID(), busy: false };

function newConv() {
  state.conv = crypto.randomUUID();
  $('conv').textContent = state.conv;
}

// 换身份时整段作废：会话 id 换一个，对话区与时间线一并清掉。
// 服务端已经不认上一位买家的会话了（ADR 0025），页面留着那些气泡就是替别人复述对话。
function resetConversation() {
  $('chat').innerHTML = '';
  clearTimeline();
  newConv();
}

// ---- SSE 帧解析：与 ticket 05 同一套，EventSource 不支持 POST，只能手解 ----
async function readSse(response, onFrame) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true }).replace(/\r\n/g, '\n');
    let cut;
    while ((cut = buf.indexOf('\n\n')) >= 0) {
      const frame = buf.slice(0, cut);
      buf = buf.slice(cut + 2);
      let name = 'message';
      let data = '';
      for (const line of frame.split('\n')) {
        if (line.startsWith('event:')) name = line.slice(6).trim();
        else if (line.startsWith('data:')) data += line.slice(5).trim();
      }
      onFrame(name, data);
    }
  }
}

async function api(method, path, body, withAuth = true) {
  const headers = { 'Content-Type': 'application/json' };
  if (withAuth && state.token) headers.Authorization = 'Bearer ' + state.token;
  // 运维凭证随每个请求带上：只有 ops 端点会读它，其余端点忽略
  headers['X-Ops-Token'] = $('opsToken').value.trim();
  const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const text = await res.text();
  let parsed = null;
  try { parsed = text ? JSON.parse(text) : null; } catch (e) { parsed = { raw: text }; }
  return { status: res.status, body: parsed };
}

// ---- 身份 ----
async function loadTenants() {
  const res = await api('GET', '/api/v1/support/ops/tenants', null);
  const list = Array.isArray(res.body) && res.body.length ? res.body
    : [{ tenantId: 'T001', name: '数码旗舰店' }, { tenantId: 'T002', name: '生鲜超市' }, { tenantId: 'T003', name: '服饰官方店' }];
  $('tenant').innerHTML = list.map((t) =>
    `<option value="${t.tenantId}">${t.tenantId} · ${t.name}</option>`).join('');
}

async function login() {
  // 下拉可能还没被代理数据填上（首次签发就发生在拉取店铺清单之前），此时用默认值而不是空串：
  // 空 tenantId 签出来的 token 会让整条链路以"无租户"身份跑下去，症状是流式端点悄悄不出 done 帧。
  const tenant = $('tenant').value || state.tenant;
  const customer = $('customer').value.trim() || 'C001';
  const res = await api('POST', '/auth/mock-token', { tenantId: tenant, customerId: customer }, false);
  if (res.status !== 200) { $('claims').textContent = '签发失败 ' + res.status; return; }
  // 只在身份真的变了时清屏：同一个人重签一次不该把对话抹掉。
  if (tenant !== state.tenant || customer !== state.customer) resetConversation();
  state.tenant = tenant;
  state.customer = customer;
  state.token = res.body.token;
  $('claims').textContent = JSON.stringify(decodeJwt(state.token), null, 1);
}

function decodeJwt(jwt) {
  const part = jwt.split('.')[1];
  return JSON.parse(atob(part.replace(/-/g, '+').replace(/_/g, '/')));
}

// ---- 对话 ----
function bubble(cls, who, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + cls;
  if (who) {
    const head = document.createElement('div');
    head.className = 'who';
    head.textContent = who;
    wrap.appendChild(head);
  }
  const body = document.createElement('div');
  body.className = 'bubble';
  body.textContent = text || '';
  wrap.appendChild(body);
  $('chat').appendChild(wrap);
  $('chat').scrollTop = $('chat').scrollHeight;
  return body;
}

// ---- 事件时间线 ----
function clearTimeline() { $('timeline').innerHTML = ''; }

/** 空输入那类「你先敲点什么」的回显：写在 composer 下面那一行，不混进对话气泡。 */
function showHint(text) { $('hint').textContent = text || ''; }

/** 首字到达之前挂在对话区末尾的一行；调用方拿到的是它自己，remove() 幂等。 */
function typingRow() {
  const row = document.createElement('div');
  row.className = 'msg bot';
  const bubble = document.createElement('div');
  bubble.className = 'bubble typing';
  bubble.textContent = '正在等模型首字';
  row.appendChild(bubble);
  $('chat').appendChild(row);
  $('chat').scrollTop = $('chat').scrollHeight;
  return row;
}

/** 4xx 的报文里票 25 起有 message，能显就显；显不了至少还是那句状态码，不假装有内容。 */
async function rejectionText(res) {
  let message = '';
  try {
    const body = await res.json();
    message = body && body.message ? String(body.message) : '';
  } catch (notJson) { message = ''; }
  return message ? `请求被拒绝：${res.status} ${message}` : `请求被拒绝：${res.status}`;
}

function ev(name, html) {
  const row = document.createElement('div');
  row.className = 'ev ' + name;
  const k = document.createElement('div');
  k.className = 'k';
  k.textContent = name;
  const v = document.createElement('div');
  v.className = 'v';
  v.innerHTML = html;
  row.append(k, v);
  $('timeline').appendChild(row);
  $('timeline').scrollTop = $('timeline').scrollHeight;
  return v;
}

const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

async function ask() {
  if (state.busy) return;
  const query = $('q').value.trim();
  if (!query) {
    // 走查第 3 项：这里原先直接 return，点发送什么也没发生，用户只能怀疑按钮坏了
    showHint('先输入一个问题，再点发送');
    $('q').focus();
    return;
  }
  showHint('');
  if (!state.token) await login();
  state.busy = true;
  $('btnSend').disabled = true;
  bubble('user', '买家 ' + state.customer, query);
  const answerEl = bubble('bot', '客服');
  // 走查第 2 项：首字实测最慢 11.6 s，这期间气泡是空的，界面像卡死。进行态单独一行，
  // 不塞进气泡里——气泡靠 textContent 累加 token，混进去就把「正在」两个字复述进答案了。
  const pending = typingRow();
  clearTimeline();
  const started = performance.now();
  let tokens = 0;
  let tokenRow = null;
  let chips = null;
  try {
    const res = await fetch('/api/v1/support/chat/stream', {
      method: 'POST',
      signal: AbortSignal.timeout(90000),
      headers: { 'Content-Type': 'application/json', Accept: 'text/event-stream',
        Authorization: 'Bearer ' + state.token, 'X-Conversation-Id': state.conv },
      body: JSON.stringify({ query })
    });
    if (!res.ok) {
      pending.remove();
      ev('fallback', 'HTTP ' + res.status);
      // 走查第 4 项的前端那一半：票 25 之后 400 的报文里有 message，回显它，而不是只剩一个状态码
      answerEl.textContent = await rejectionText(res);
      return;
    }
    await readSse(res, (name, raw) => {
      let d = {};
      try { d = JSON.parse(raw); } catch (e) { d = { text: raw }; }
      if (typeof d === 'string') d = { text: d };
      const text = d.text ?? raw;
      if (name === 'token') {
        pending.remove();
        tokens++;
        answerEl.textContent += text;
        if (!tokenRow) {
          chips = document.createElement('div');
          chips.className = 'chips';
          tokenRow = ev('token', '');
          tokenRow.appendChild(chips);
        }
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = text;
        chips.appendChild(chip);
        $('chat').scrollTop = $('chat').scrollHeight;
        return;
      }
      if (name === 'status') { ev('status', esc(d.label) + ' <span class="dim">' + esc(d.detail || '') + '</span>'); return; }
      if (name === 'meta') {
        ev('meta', `intent <b>${esc(d.intent) || '-'}</b> · cache <b>${esc(d.cacheLayer)}</b>`
          + (d.cacheHit ? ' <span class="dim">命中：一次性下发</span>' : ' <span class="dim">未命中：打字机</span>'));
        return;
      }
      if (name === 'tool_executing') { ev('tool_executing', esc(d.tool) + ' <span class="dim">' + esc(d.label || '') + '</span>'); return; }
      if (name === 'tool_result') { ev('tool_result', esc(d.tool) + ' <b>' + esc(d.status) + '</b>'); return; }
      if (name === 'duplicate_submit') { ev('duplicate_submit', esc(d.tool) + ' <span class="dim">' + esc(d.message) + '</span>'); return; }
      if (name === 'slot_ask') { ev('slot_ask', esc(d.slot) + ' <span class="dim">' + esc(d.question) + '</span>'); return; }
      if (name === 'fallback') { ev('fallback', `<b>${esc(d.reason)}</b> 工单 <span class="dim">${esc(d.ticketId || '-')}</span>`); return; }
      if (name === 'rate_limited') { ev('rate_limited', esc(d.message) + ' <span class="dim">retry ' + esc(d.retryAfterMs) + 'ms</span>'); return; }
      if (name === 'done') {
        const ms = Math.round(performance.now() - started);
        const cites = d.citations || [];
        ev('done', `引用 ${cites.length} · token ${d.usage ? d.usage.promptTokens + '/' + d.usage.completionTokens : '-'}`
          + ` · <span class="dim">${ms}ms / ${tokens} 帧</span>`);
        // 规则 id 是 40 位哈希，摊在答案下面会把答案本身挤没；默认收成一行，点开再看
        if (cites.length) {
          const box = document.createElement('details');
          box.className = 'cite';
          const summary = document.createElement('summary');
          summary.textContent = `依据条款 ${cites.length} 条`;
          const list = document.createElement('ul');
          list.innerHTML = cites.map((c) => `<li>${esc(c)}</li>`).join('');
          box.append(summary, list);
          answerEl.parentElement.appendChild(box);
        }
      }
    });
  } catch (failure) {
    pending.remove();
    ev('fallback', 'stream error <span class="dim">' + esc(failure.message) + '</span>');
  } finally {
    pending.remove();
    state.busy = false;
    $('btnSend').disabled = false;
    // 每一轮答完补一次依赖读数：这一轮是齐的还是降级的，答案本身答不了，得让灯跟着这一轮走。
    // 不 await——读数慢不许把输入框锁在这一轮之后。
    refreshHealth();
  }
}

// ---- 故障注入（全部经网关运维代理，页面不接触 biz-mock 内部凭证）----
function setLlmMode(mode) {
  [...$('llmSeg').children].forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
}

async function applyFaults() {
  const delayMs = Number($('delay').value);
  const failRate = Number($('failRate').value);
  const biz = await api('PUT', '/api/v1/support/ops/fault', { delayMs, failRate });
  const mode = [...$('llmSeg').children].find((b) => b.getAttribute('aria-pressed') === 'true').dataset.mode;
  const llm = await api('PUT', '/api/v1/support/ops/llm-fault', { mode });
  report(biz.status === 200 && llm.status === 200,
    biz.status === 200 && llm.status === 200 ? `已注入 delay=${delayMs}ms fail=${failRate} llm=${mode}`
      : '注入被拒绝：' + JSON.stringify(biz.body) + ' ' + JSON.stringify(llm.body));
  await refreshOps();
}

async function clearFaults() {
  $('delay').value = 0; $('failRate').value = 0; syncSliders(); setLlmMode('none');
  await api('PUT', '/api/v1/support/ops/fault', { delayMs: 0, failRate: 0 });
  await api('PUT', '/api/v1/support/ops/llm-fault', { mode: 'none' });
  report(true, '故障已清除');
  await refreshOps();
}

/** 读数格只经由这里写：失败路径与成功路径共用同一支笔，才不会再出现「失败时留在上一格」。 */
function setGauge(id, text, stale) {
  const el = $(id);
  el.textContent = text;
  el.dataset.state = stale ? 'stale' : 'live';
}

/** 失败时要说出是哪一种失败：票 25 之后 403 的报文自带 code，没报文就退回状态码。 */
function failureReason(res) {
  return res.body && res.body.code ? String(res.body.code) : 'HTTP ' + res.status;
}

async function refreshOps() {
  // 走查第 9 项：这一格原先只在成功时写字，失败时 footer 上留的还是上一次的成功值——
  // 指标没撒谎，但它装死。现在失败就把「读不到 + 为什么」写上去。
  const circuit = await api('GET', '/api/v1/support/ops/circuit', null, true);
  if (circuit.status === 200 && circuit.body) {
    setGauge('circuit', circuit.body.circuitState + ' / ' + circuit.body.llmMode, false);
    setGauge('mode', 'mode ' + circuit.body.llmMode, false);
  } else {
    setGauge('circuit', '读不到：' + failureReason(circuit), true);
    setGauge('mode', 'mode 读不到', true);
  }
  // stats 是运维凭证守护的端点，令牌框空着去读必然吃一发 403（票 21 起页面不再预填令牌，
  // ADR 0029）。没凭证就是「没得看」而不是「出错了」：这里不发那一枪，浏览器控制台才不会
  // 每次开页面都留下红字，验收里「页面无失败请求」那条断言量的才是真失败。
  if (!$('opsToken').value.trim()) {
    setGauge('refunds', '未填令牌', true);
    return;
  }
  const stats = await api('GET', '/api/v1/support/ops/stats', null, true);
  if (stats.status === 200) {
    setGauge('refunds', String(stats.body.refunds), false);
  } else {
    setGauge('refunds', '读不到：' + failureReason(stats), true);
  }
}

// ---- 健康灯：读 deps 组，不读 readiness（ADR 0026）----
// 三态各有各的判据：不挂 class = 三格齐；bad = 至少一格 DOWN，即「还能应答但已经缺一条路」；
// unknown = 这个读数本身取不到。就绪门里只有 readinessState，拿它当灯就是恒绿的那半个成因，
// 所以这里读 /actuator/health/deps —— 它的 DOWN 不摘流量，只负责让人看见。
// 颜色之外另留一个 data-state：验收脚本要断的是「灯知道自己该是什么色」，不该去猜 computed style。
async function refreshHealth() {
  const dot = $('health');
  dot.classList.remove('bad');
  dot.classList.remove('unknown');
  dot.dataset.state = '';
  dot.title = '依赖状态：读数加载中';
  let body = null;
  try {
    // DOWN 时 Spring Boot 把这一格映射成 503，但响应体仍是合法读数：只认 body.status，
    // 不拿 HTTP 码当健康判据（拿码当判据等于把 503 又读成「读不到」）。
    const res = await fetch('/actuator/health/deps');
    body = await res.json();
  } catch (e) {
    body = null;
  }
  if (!body || !body.status) {
    dot.classList.add('unknown');
    dot.dataset.state = 'unknown';
    dot.title = '依赖状态：读不到 /actuator/health/deps';
    return;
  }
  const components = body.components || {};
  const names = Object.keys(components);
  const down = names.filter((n) => components[n].status !== 'UP');
  // 有成员明细时按成员点名；被人把 show-components 关掉时退回整体状态，总之不许在 DOWN 上留绿。
  const degraded = down.length > 0 || (names.length === 0 && body.status !== 'UP');
  if (degraded) {
    dot.classList.add('bad');
    dot.dataset.state = 'bad';
    dot.title = down.length ? '依赖降级：' + down.join('、') + ' 不为 UP' : '依赖整体 ' + body.status;
  } else {
    dot.dataset.state = 'ok';
    dot.title = names.length ? '向量、词法、语料三格齐 UP' : '依赖整体 UP';
  }
}

function report(ok, message) {
  // 走查第 10 项：运维回执原先混在问答事件流里，既被每轮 clearTimeline() 清掉，
  // 又让「.ev.done 表示这一轮答完了」那条判据有机会读到自己写的行。现在它另起一条流。
  const row = document.createElement('div');
  row.className = 'ops ' + (ok ? 'ok' : 'bad');
  row.innerHTML = `<div class="k">ops</div><div class="v">${esc(message)}</div>`;
  $('opslog').appendChild(row);
  if ($('opslogEmpty')) $('opslogEmpty').remove();
  $('opslog').scrollTop = $('opslog').scrollHeight;
}

// ---- 工单抽屉 ----
/** 走查第 11 项：抽屉原先盖住 header，那颗「工单队列」按钮被自己的抽屉挡住，
 *  跑器在第二次点它时超时 30 s 崩过。现在抽屉从 header 下沿开始，另配一层可点的遮罩。 */
function openDrawer() {
  $('drawer').classList.add('open');
  $('scrim').hidden = false;
  loadTickets();
}

function closeDrawer() {
  $('drawer').classList.remove('open');
  $('scrim').hidden = true;
}

/** 工单卡片带时间戳（次一级项）：坐席排队列先看的是「这单挂了多久」。 */
function fmtTime(raw) {
  if (!raw && raw !== 0) return '-';
  const when = new Date(raw);
  return Number.isNaN(when.getTime()) ? String(raw)
    : when.toLocaleString('zh-CN', { hour12: false, month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

async function loadTickets() {
  const res = await api('GET', '/api/v1/support/ops/tickets', null, true);
  if (res.status !== 200) { $('tickets').innerHTML = '<div class="empty">拉取失败 ' + res.status + '</div>'; return; }
  if (!res.body.length) { $('tickets').innerHTML = '<div class="empty">当前店铺暂无工单</div>'; return; }
  $('tickets').innerHTML = res.body.map((t) => `
    <div class="tk">
      <div><div class="id">${esc(t.id)} · ${esc(t.reason)} · ${esc(t.customerId)} · ${esc(fmtTime(t.createdAt))}</div>
        <div class="q">${esc(t.userQuery)}</div>
        <div class="row" style="margin-top:6px">
          <button class="sm" data-tk="${esc(t.id)}" data-to="ASSIGNED">认领</button>
          <button class="sm" data-tk="${esc(t.id)}" data-to="RESOLVED">结单</button>
        </div></div>
      <span class="badge ${esc(t.status)}">${esc(t.status)}</span>
    </div>`).join('');
  $('tickets').querySelectorAll('button[data-to]').forEach((btn) => {
    btn.onclick = async () => {
      const r = await api('PATCH', '/api/v1/support/ops/tickets/' + btn.dataset.tk + '/status', { status: btn.dataset.to });
      report(r.status === 200, r.status === 200 ? `${btn.dataset.tk} -> ${btn.dataset.to}`
        : `流转被拒 ${r.status}：${btn.dataset.tk} -> ${btn.dataset.to}`);
      loadTickets();
    };
  });
}

function syncSliders() {
  $('delayV').textContent = $('delay').value + ' ms';
  $('failRateV').textContent = Number($('failRate').value).toFixed(2);
}

// ---- 装配 ----
$('btnLogin').onclick = login;
$('btnNewConv').onclick = newConv;
$('btnSend').onclick = ask;
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(); });
$('delay').oninput = syncSliders;
$('failRate').oninput = syncSliders;
$('llmSeg').querySelectorAll('button').forEach((b) => { b.onclick = () => setLlmMode(b.dataset.mode); });
$('btnApply').onclick = applyFaults;
$('btnClear').onclick = clearFaults;
// 令牌是人敲进来的，敲完顺手把运维读数补上（不然 refunds 会一直停在初始值）
// 令牌是人敲进来（多半是粘进来）的，粘完不挪鼠标就去点别的按钮，是这台调试台的常态。
// 挂在 change 上等于要等失焦才补读数，那一眼里 footer 上还是上一次的值。改成输入后去抖 400ms：
// 粘贴生效即读数，又不至于每敲一个字符就打一发 ops 请求。
let opsTokenTimer = 0;
$('opsToken').oninput = () => { clearTimeout(opsTokenTimer); opsTokenTimer = setTimeout(refreshOps, 400); };
$('btnFlush').onclick = async () => {
  const r = await api('POST', '/api/v1/support/ops/cache/flush', {});
  report(r.status === 200, '清缓存 ' + JSON.stringify(r.body));
};
$('btnDemo').onclick = async () => {
  const r = await api('POST', '/api/v1/support/ops/demo/reset', {});
  report(r.status === 200, '演示单复位 ' + JSON.stringify(r.body));
  refreshOps();
};
$('btnTickets').onclick = openDrawer;
$('btnCloseTickets').onclick = closeDrawer;
$('scrim').onclick = closeDrawer;
// Esc 关抽屉：键盘用户不该只能去找那颗鼠标才看得见的关闭按钮
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('drawer').classList.contains('open')) closeDrawer();
});

(async function boot() {
  newConv();
  syncSliders();
  // 先签一个身份再拉店铺清单：租户下拉是运维代理端点，没身份会被 AuthFilter 401，
  // 于是静默退化成页面里那份兜底名单——那正是"写死名单会和后端分家"的起点。
  await login();
  await loadTenants();
  $('tenant').value = state.tenant;
  // 灯要自己会说话：deps 不鉴权，开页即读一次。它红了不影响这一页问答，
  // 影响的只是「这一轮的降级是已知的，不是被恒绿盖住的」。
  await refreshHealth();
  await refreshOps();
})();
</script>
