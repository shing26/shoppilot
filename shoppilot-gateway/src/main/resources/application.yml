server:
  port: 8082
  # 停机预算（票 27，ADR 0030）：HTTP 收尾用 Spring 默认 30s 不另调，缓存写回池 drain 另给 5s，
  # 总预算 35s 写在 README 运维段；stop.ps1 的等端口释放超时以它为下限。
  shutdown: graceful
  # 回环绑定是「dev 默认凭证可以用」的唯一前提（ADR 0029）：改成别的地址，
  # 三处默认值任一没被环境变量覆盖就启动失败，mock 身份签发端点也不再注册。
  # 这只是必要条件，不是防线——反向代理打进来的同样是 127.0.0.1。
  address: 127.0.0.1

spring:
  application:
    name: shoppilot-gateway
  threads:
    virtual:
      # ticket 18 的对比实验靠 no-virtual profile 关掉它，不改代码
      enabled: true
  data:
    redis:
      host: ${SHOPPILOT_REDIS_HOST:127.0.0.1}
      port: ${SHOPPILOT_REDIS_PORT:16379}
      timeout: 2s
      lettuce:
        pool:
          max-active: 64
          max-idle: 16
          min-idle: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      # 同上：非 K8s 环境要显式打开探针指示器，readiness 组才存在。
      probes:
        enabled: true
      group:
        # Same readiness gate as biz-mock: the gateway's StartupInitializer/IngestRunner
        # are ApplicationRunners, so plain /actuator/health can report UP before the
        # knowledge base and intent centroids are actually usable.
        readiness:
          include: readinessState
        liveness:
          include: livenessState
        # 可降级依赖的真实状态（ADR 0026）：这一组**刻意不进 readiness**。门禁与起栈脚本都以
        # readiness 为放行谓词，而 nocache / no-ollama / nodeps 这些实验档存在的意义就是把某个
        # 依赖人为弄残去证明降级路径成立；并进就绪门等于用运维口把 fail-open 改回 fail-closed。
        # 明细不外泄：这一组只报每个成员 UP/DOWN，URL 与计数留在未分组的 /actuator/health 里。
        deps:
          include: qdrant,elasticsearch,knowledgeBase
          show-components: always
          show-details: never

shoppilot:
  # ADR 0014：mock JWT 签名密钥，至少 32 字节。
  # 默认值不在这里写：它由 DevDefaultsPolicy 持有、只在回环绑定时由环境后置处理器兜进来，
  # 守护判的必须是真正在用的那个值，两处各写一份迟早分家（ADR 0029）。
  jwt-secret: ${SHOPPILOT_JWT_SECRET:}
  llm:
    # dev | local | perf —— 三态模式，指标分口径声明见 ADR 0001
    mode: local
    base-url: ${SHOPPILOT_LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${SHOPPILOT_LLM_API_KEY:}
    model: ${SHOPPILOT_LLM_MODEL:qwen-plus}
    temperature: 0.2
    connect-timeout: 3s
    # 默认 20s 是按云端 API 定的；指向慢端点（例如本地 OpenAI 兼容服务）时要能放宽，
    # 否则非流式的工具规划轮会成片报 TIMEOUT，测出来的数字属于超时而不是模型能力。
    read-timeout: ${SHOPPILOT_LLM_READ_TIMEOUT:20s}
    # ADR 0012：dev 模式 token 日预算熔断
    # 默认 20 万，但必须可覆盖：ticket 16 的完整评测集是 180 条，单条实测约 1.1k token，
    # 一轮就要 ~19 万，正好贴着默认值。这种情况下唯一能改预算的办法应该是设环境变量，
    # 而不是为了让验收动作跑起来去动仓库里的配置文件。
    daily-token-budget: ${SHOPPILOT_LLM_DAILY_TOKEN_BUDGET:200000}
    local-base-url: ${SHOPPILOT_OLLAMA_URL:http://127.0.0.1:11434}
    local-model: ${SHOPPILOT_LOCAL_LLM_MODEL:qwen2.5:3b}
    perf-first-token-latency: 300ms
    perf-total-latency: 500ms
    # ADR 0044 票 50：显式输出上限。这是**稳定性护栏**不是成本优化（成本护栏是上面的日预算熔断）。
    # 默认给足余量：PromptCatalog 规则 11 要求回答「不超过 200 字」，而输出里还要含工具调用 JSON，
    # 按 200 字设小会截断评测答案、反过来污染 dev 读数。0 = 不限制（本字段引入前的行为）。
    max-output-tokens: ${SHOPPILOT_LLM_MAX_OUTPUT_TOKENS:1024}
  embedding:
    # ADR 0001：embedding 恒为本地 bge-m3，1024 维
    base-url: ${SHOPPILOT_OLLAMA_URL:http://127.0.0.1:11434}
    model: ${SHOPPILOT_EMBED_MODEL:bge-m3}
    dimension: 1024
    timeout: 5s
    # 进程内向量缓存开关：默认开（命中路径靠它做到零远程向量化），归因实验用 profile 关掉
    in-process-cache: true
    # 仅预热与入库使用：Ollama 首次调用要把模型载入内存，运行期请求不享受这个放宽
    warmup-timeout: 60s
  retrieval:
    qdrant-url: ${SHOPPILOT_QDRANT_URL:http://127.0.0.1:16333}
    es-url: ${SHOPPILOT_ES_URL:http://127.0.0.1:19200}
    rule-collection: policy_rules
    cache-collection: answer_cache
    es-index: policy_rules
    dense-top-k: 20
    lexical-top-k: 20
    fused-top-k: 5
    rrf-k: 60
  cache:
    enabled: true
    l1-ttl: 6h
    # ADR 0003：阈值只负责同意图内表述归一，串号防线在缓存准入与意图分区
    semantic-threshold: 0.95
    negative-ttl: 60s
    singleflight-wait-timeout: 2s
    # 防击穿合并开关，只有 nosf profile 会关它（token 基线）
    singleflight-enabled: true
  bizmock:
    base-url: ${SHOPPILOT_BIZMOCK_URL:http://127.0.0.1:8091}
    # 同上：默认值单一来源在 DevDefaultsPolicy。biz-mock 自己那份是接收端，保持原样。
    internal-token: ${SHOPPILOT_INTERNAL_TOKEN:}
    connect-timeout: 2s
    read-timeout: 3s
  agent:
    # ADR 0008：工具循环硬上限
    max-tool-rounds: 2
    # ticket 11：缺槽位只追问一次
    max-slot-asks: 1
    session-ttl: 30m
    history-turns: 6
  ratelimit:
    enabled: true
    default-tenant-qps: 200
    customer-qps: 5
    ip-qps: 20
    # 店铺配额默认从 biz-mock 的 tenants 表读，这里只是兜底值；只有 perf profile 会绕过它。
    override-tenant-quota: false
  ingest:
    # 政策语料目录，相对项目根目录；CI 与本机一致
    dir: ${SHOPPILOT_KNOWLEDGE_DIR:knowledge}
  triage:
    # T1 意图质心的本地缓存，按样本指纹失效；删掉它会重新向量化 90 条样本
    centroid-cache: ${SHOPPILOT_CENTROID_CACHE:.cache/intent-centroids.json}
  ops:
    # 调试台的故障注入 / 工单队列 / 演示复位经网关代理到 biz-mock（ticket 14、15）。
    # 生产必须置 false：故障注入是平台级动作，能拖慢整条链路。
    enabled: ${SHOPPILOT_OPS_ENABLED:true}
    # 同上。非回环绑定时「仍用默认令牌且没关掉运维端点」是启动阻断项（ADR 0029）。
    token: ${SHOPPILOT_OPS_TOKEN:}

---
spring:
  config:
    activate:
      on-profile: dev
shoppilot:
  llm:
    mode: dev

---
spring:
  config:
    activate:
      on-profile: local
shoppilot:
  llm:
    mode: local

---
spring:
  config:
    activate:
      on-profile: perf
shoppilot:
  llm:
    mode: perf
  ratelimit:
    # 压测测的是编排层与缓存层，不是限流器本身；限流行为由 ticket 13 的用例与 verify-ratelimit 负责。
    # 这里刻意"调高"而不是"关掉"：关掉会让 Redisson 整条路径退出被测范围，那组数字就没有意义了。
    # 压测报告与 README 必须注明本组数字是在这个配额下取得的。
    default-tenant-qps: 100000
    customer-qps: 100000
    ip-qps: 100000
    override-tenant-quota: true

---
spring:
  config:
    activate:
      on-profile: nocache
shoppilot:
  cache:
    # Token 节约率的基线组：与 perf 组合使用（-Profile perf,nocache），
    # 同一套流量模型、同一组限流配额，只关缓存。
    # 基线不是"假设没有缓存会怎样"，是实测出来的 token 数。
    enabled: false

---
spring:
  config:
    activate:
      on-profile: nosf
shoppilot:
  cache:
    # 与 perf,nocache 组合成"零防线"基线：缓存与防击穿合并都关掉，
    # 这一档的 tokens/request 才是"每个请求真打模型"的实测值。
    singleflight-enabled: false

---
spring:
  config:
    activate:
      on-profile: no-virtual
  threads:
    virtual:
      enabled: false
server:
  tomcat:
    threads:
      max: 200
      min-spare: 20

---
spring:
  config:
    activate:
      on-profile: no-embedding-cache
shoppilot:
  embedding:
    # 关掉 EmbeddingClient 的进程内向量缓存，让命中路径也暴露出真实的向量化调用。
    # 这是归因实验：L2 曲线的天花板到底来自编排还是本地 bge-m3 推理，只有这一组能分开。
    in-process-cache: false

---
spring:
  config:
    activate:
      on-profile: no-ollama
shoppilot:
  embedding:
    # 归因实验（ticket 18 的"压测期间模型服务停用"那一格）：把向量服务指到无人监听的端口，
    # 连接立即被拒，等价于 Ollama 整个进程没了——但只影响本系统，不碰别人共用的 11434。
    # perf 已把生成侧换成 MockLLM，所以这一组量的是"模型与向量服务都不在"时网关自身的天花板，
    # 以及 ADR 0018 要守的性质：L1 还要不要继续积累。
    base-url: http://127.0.0.1:59999

---
spring:
  config:
    activate:
      on-profile: ingest
  # 入库是一次性脚本，不需要监听端口；关掉 web 容器也避免 8082 占用冲突
  main:
    web-application-type: none

---
spring:
  config:
    activate:
      on-profile: nodeps
shoppilot:
  retrieval:
    # ADR 0026 的实验档：把两个检索引擎指到无人监听的端口，等价于它们整个没了（与 no-ollama 同一家法，
    # 只影响本系统，不碰别人共用的 19200/16333）。这一档要证的性质是：deps 组红，而 readiness 仍 UP、
    # 问答按既有降级路径照出——也就是"没从运维口把 fail-open 改回 fail-closed"。
    qdrant-url: http://127.0.0.1:59997
    es-url: http://127.0.0.1:59998
