server:
  port: 8082
  address: 127.0.0.1

spring:
  application:
    name: shoppilot-gateway
  threads:
    virtual:
      # ticket 18 的对比实验靠 no-virtual profile 关掉它，不改代码
      enabled: true
  data:
    redis:
      host: ${SHOPPILOT_REDIS_HOST:127.0.0.1}
      port: ${SHOPPILOT_REDIS_PORT:16379}
      timeout: 2s
      lettuce:
        pool:
          max-active: 64
          max-idle: 16
          min-idle: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

shoppilot:
  # ADR 0014：mock JWT 签名密钥，至少 32 字节
  jwt-secret: ${SHOPPILOT_JWT_SECRET:dev-jwt-secret-change-me-please-0123456789}
  llm:
    # dev | local | perf —— 三态模式，指标分口径声明见 ADR 0001
    mode: local
    base-url: ${SHOPPILOT_LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${SHOPPILOT_LLM_API_KEY:}
    model: ${SHOPPILOT_LLM_MODEL:qwen-plus}
    temperature: 0.2
    connect-timeout: 3s
    read-timeout: 20s
    # ADR 0012：dev 模式 token 日预算熔断
    daily-token-budget: 200000
    local-base-url: ${SHOPPILOT_OLLAMA_URL:http://127.0.0.1:11434}
    local-model: ${SHOPPILOT_LOCAL_LLM_MODEL:qwen2.5:3b}
    perf-first-token-latency: 300ms
    perf-total-latency: 500ms
  embedding:
    # ADR 0001：embedding 恒为本地 bge-m3，1024 维
    base-url: ${SHOPPILOT_OLLAMA_URL:http://127.0.0.1:11434}
    model: ${SHOPPILOT_EMBED_MODEL:bge-m3}
    dimension: 1024
    timeout: 5s
    # 进程内向量缓存开关：默认开（命中路径靠它做到零远程向量化），归因实验用 profile 关掉
    in-process-cache: true
    # 仅预热与入库使用：Ollama 首次调用要把模型载入内存，运行期请求不享受这个放宽
    warmup-timeout: 60s
  retrieval:
    qdrant-url: ${SHOPPILOT_QDRANT_URL:http://127.0.0.1:16333}
    es-url: ${SHOPPILOT_ES_URL:http://127.0.0.1:19200}
    rule-collection: policy_rules
    cache-collection: answer_cache
    es-index: policy_rules
    dense-top-k: 20
    lexical-top-k: 20
    fused-top-k: 5
    rrf-k: 60
  cache:
    enabled: true
    l1-ttl: 6h
    # ADR 0003：阈值只负责同意图内表述归一，串号防线在缓存准入与意图分区
    semantic-threshold: 0.95
    negative-ttl: 60s
    singleflight-wait-timeout: 2s
  bizmock:
    base-url: ${SHOPPILOT_BIZMOCK_URL:http://127.0.0.1:8091}
    internal-token: ${SHOPPILOT_INTERNAL_TOKEN:dev-internal-token-change-me}
    connect-timeout: 2s
    read-timeout: 3s
  agent:
    # ADR 0008：工具循环硬上限
    max-tool-rounds: 2
    # ticket 11：缺槽位只追问一次
    max-slot-asks: 1
    session-ttl: 30m
    history-turns: 6
  ratelimit:
    enabled: true
    default-tenant-qps: 200
    customer-qps: 5
    ip-qps: 20
    # 店铺配额默认从 biz-mock 的 tenants 表读，这里只是兜底值；只有 perf profile 会绕过它。
    override-tenant-quota: false
  ingest:
    # 政策语料目录，相对项目根目录；CI 与本机一致
    dir: ${SHOPPILOT_KNOWLEDGE_DIR:knowledge}
  triage:
    # T1 意图质心的本地缓存，按样本指纹失效；删掉它会重新向量化 90 条样本
    centroid-cache: ${SHOPPILOT_CENTROID_CACHE:.cache/intent-centroids.json}
  ops:
    # 调试台的故障注入 / 工单队列 / 演示复位经网关代理到 biz-mock（ticket 14、15）。
    # 生产必须置 false：故障注入是平台级动作，能拖慢整条链路。
    enabled: ${SHOPPILOT_OPS_ENABLED:true}
    token: ${SHOPPILOT_OPS_TOKEN:dev-ops-token}

---
spring:
  config:
    activate:
      on-profile: dev
shoppilot:
  llm:
    mode: dev

---
spring:
  config:
    activate:
      on-profile: local
shoppilot:
  llm:
    mode: local

---
spring:
  config:
    activate:
      on-profile: perf
shoppilot:
  llm:
    mode: perf
  ratelimit:
    # 压测测的是编排层与缓存层，不是限流器本身；限流行为由 ticket 13 的用例与 verify-ratelimit 负责。
    # 这里刻意"调高"而不是"关掉"：关掉会让 Redisson 整条路径退出被测范围，那组数字就没有意义了。
    # 压测报告与 README 必须注明本组数字是在这个配额下取得的。
    default-tenant-qps: 100000
    customer-qps: 100000
    ip-qps: 100000
    override-tenant-quota: true

---
spring:
  config:
    activate:
      on-profile: nocache
shoppilot:
  cache:
    # Token 节约率的基线组：与 perf 组合使用（-Profile perf,nocache），
    # 同一套流量模型、同一组限流配额，只关缓存。
    # 基线不是"假设没有缓存会怎样"，是实测出来的 token 数。
    enabled: false

---
spring:
  config:
    activate:
      on-profile: no-virtual
  threads:
    virtual:
      enabled: false
server:
  tomcat:
    threads:
      max: 200
      min-spare: 20

---
spring:
  config:
    activate:
      on-profile: no-embedding-cache
shoppilot:
  embedding:
    # 关掉 EmbeddingClient 的进程内向量缓存，让命中路径也暴露出真实的向量化调用。
    # 这是归因实验：L2 曲线的天花板到底来自编排还是本地 bge-m3 推理，只有这一组能分开。
    in-process-cache: false

---
spring:
  config:
    activate:
      on-profile: ingest
  # 入库是一次性脚本，不需要监听端口；关掉 web 容器也避免 8082 占用冲突
  main:
    web-application-type: none
